[package]
name = "framend-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"

[lib]
name = "framend_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
recovery-engine = { path = "../../engine" }
process-wrap = { version = "10", features = ["std"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
