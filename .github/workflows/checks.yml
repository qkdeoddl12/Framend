name: Recovery checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        os: [macos-15, macos-15-intel, windows-2025]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@master
        with:
          # Tauri 2.11 expects the pre-1.100 Cargo build directory layout.
          toolchain: 1.99.1
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --manifest-path engine/Cargo.toml --check

      - name: Run tests
        run: cargo test --manifest-path engine/Cargo.toml --quiet

      - name: Run clippy
        run: cargo clippy --manifest-path engine/Cargo.toml --all-targets -- -D warnings

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Run tests
        working-directory: desktop
        run: npm test

      - name: Stage engine
        working-directory: desktop
        run: npm run stage-engine

      - name: Verify portable file recovery
        shell: bash
        run: |
          cargo build --manifest-path engine/Cargo.toml --locked
          python scripts/test-desktop-jobs.py --engine "engine/target/debug/recovery-engine${{ matrix.os == 'windows-2025' && '.exe' || '' }}" --output-root "${{ runner.temp }}"

      - name: Build
        working-directory: desktop
        run: npm run build

      - name: Test desktop app
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --quiet

      - name: Build macOS app
        if: matrix.os == 'macos-15'
        run: bash scripts/build-app.sh

      - name: Package common macOS app
        if: runner.os == 'macOS'
        working-directory: desktop
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: npm run desktop:build -- --bundles app,dmg --ci

      - name: Verify macOS download
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          dmg=(desktop/src-tauri/target/release/bundle/dmg/*.dmg)
          mount="$RUNNER_TEMP/framend-mount"
          mkdir -p "$mount"
          hdiutil verify "${dmg[0]}"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "${dmg[0]}"
          trap 'hdiutil detach "$mount"' EXIT
          codesign --verify --deep --strict "$mount/Framend.app"
          python3 scripts/test-desktop-jobs.py --engine "$mount/Framend.app/Contents/MacOS/recovery-engine" --output-root "$RUNNER_TEMP"

      - name: Package Windows installer
        if: matrix.os == 'windows-2025'
        working-directory: desktop
        run: npm run desktop:build -- --bundles nsis

      - name: Install and launch Windows download
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-Item desktop/src-tauri/target/release/bundle/nsis/*.exe
          $installDir = Join-Path $env:RUNNER_TEMP 'Framend'
          $setup = Start-Process $installer.FullName -ArgumentList "/S /D=$installDir" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer exit code $($setup.ExitCode)" }
          $gui = Start-Process "$installDir/framend-desktop.exe" -PassThru
          try {
            $deadline = [datetime]::UtcNow.AddSeconds(60)
            do {
              Start-Sleep -Milliseconds 300
              $gui.Refresh()
              if ($gui.HasExited) { throw "App exited during launch" }
            } until ($gui.MainWindowTitle -eq 'Framend' -or [datetime]::UtcNow -ge $deadline)
            if ($gui.MainWindowTitle -ne 'Framend') { throw "Framend window did not open" }
            python scripts/test-desktop-jobs.py --engine "$installDir/recovery-engine.exe" --output-root "$env:RUNNER_TEMP"
            if ($LASTEXITCODE -ne 0) { throw "Installed engine recovery failed" }
          } finally {
            if (!$gui.HasExited) { $gui.Kill() }
          }

      - name: Keep verified installer
        uses: actions/upload-artifact@v4
        with:
          name: framend-${{ matrix.os }}
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Run RecoveryChecks
        if: matrix.os == 'macos-15'
        run: |
          swift scripts/make-demo.swift
          swift run RecoveryChecks --integration --broken-pipe --bad-json
