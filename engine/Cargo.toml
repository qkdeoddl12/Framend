[package]
name = "recovery-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
process-wrap = { version = "10.0.1", default-features = false, features = ["std", "process-group", "job-object"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
